version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: rail-prism-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - rail-prism-network

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rail-prism-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rail-prism-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rail-prism-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rail-prism-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rail-prism-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3001
      WS_PORT: 3002
      MONGODB_URI: mongodb+srv://username:password@cluster.mongodb.net/rail_prism?retryWrites=true&w=majority
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: rail-prism-backend
      KAFKA_GROUP_ID: rail-prism-group
      KAFKA_TRAIN_POSITIONS_TOPIC: train-positions
      KAFKA_TRAIN_EVENTS_TOPIC: train-events
      KAFKA_OPTIMIZATION_RESULTS_TOPIC: optimization-results
      OPTIMIZATION_TIMEOUT_MS: 5000
      MAX_CONFLICTS_PER_BATCH: 10
      LOG_LEVEL: info
      JWT_SECRET: your-super-secret-jwt-key
      API_RATE_LIMIT: 100
    depends_on:
      - redis
      - kafka
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - rail-prism-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: rail-prism-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: http://localhost:3002
    depends_on:
      - backend
    networks:
      - rail-prism-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: rail-prism-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rail-prism-network

volumes:
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  rail-prism-network:
    driver: bridge