version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: rail-prism-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    networks:
      - rail-prism-dev-network

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rail-prism-zookeeper-dev
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - kafka_data_dev:/var/lib/zookeeper/data
    networks:
      - rail-prism-dev-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rail-prism-kafka-dev
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    networks:
      - rail-prism-dev-network

  # Backend Development Server
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rail-prism-backend-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3001
      WS_PORT: 3002
      MONGODB_URI: mongodb+srv://username:password@cluster.mongodb.net/rail_prism?retryWrites=true&w=majority
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: rail-prism-backend-dev
      KAFKA_GROUP_ID: rail-prism-dev-group
      KAFKA_TRAIN_POSITIONS_TOPIC: train-positions
      KAFKA_TRAIN_EVENTS_TOPIC: train-events
      KAFKA_OPTIMIZATION_RESULTS_TOPIC: optimization-results
      OPTIMIZATION_TIMEOUT_MS: 5000
      MAX_CONFLICTS_PER_BATCH: 10
      LOG_LEVEL: debug
      JWT_SECRET: dev-super-secret-jwt-key
      API_RATE_LIMIT: 1000
    depends_on:
      - redis
      - kafka
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    networks:
      - rail-prism-dev-network
    command: npm run dev

  # Frontend Development Server
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rail-prism-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: http://localhost:3001
      VITE_NODE_ENV: development
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rail-prism-dev-network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # MongoDB (Optional - for local development)
  mongodb-dev:
    image: mongo:7.0
    container_name: rail-prism-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: rail_prism
    volumes:
      - mongodb_data_dev:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - rail-prism-dev-network
    profiles:
      - mongodb

volumes:
  redis_data_dev:
    driver: local
  kafka_data_dev:
    driver: local
  mongodb_data_dev:
    driver: local

networks:
  rail-prism-dev-network:
    driver: bridge